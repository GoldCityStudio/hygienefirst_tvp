# Nginx Configuration for Clean Chinese URLs
# Hygiene First Website - Traditional Chinese Pages

# Main server block
server {
    listen 80;
    listen 443 ssl http/2;
    server_name hygienefirst.com www.hygienefirst.com;
    
    # Document root
    root /var/www/html;
    index index.html index.htm;
    
    # SSL configuration (adjust paths to your certificates)
    ssl_certificate /path/to/your/certificate.crt;
    ssl_certificate_key /path/to/your/private.key;
    
    # Clean URL rewriting
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Specific rules for Chinese pages
    location = /家居藥物回收計劃 {
        try_files $uri $uri.html $uri/ =404;
    }
    location = /藥物分類搜尋引擎器 {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Handle trailing slashes
    location ~ ^(.+)/$ {
        return 301 $scheme://$host$1;
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss text/csv application/csv image/svg+xml;
    
    # Cache control
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
