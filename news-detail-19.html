                    <p>Hygiene First 首衛全體員工熱烈慶祝中華人民共和國成立75周年！在這個重要的歷史時刻，我們深感自豪能夠為祖國的繁榮發展貢獻自己的力量。</p>
                    
                    <p>慶祝活動包括：</p>
                    <ul>
                        <li>升旗儀式</li>
                        <li>愛國歌曲演唱</li>
                        <li>國慶主題講座</li>
                        <li>員工慶祝活動</li>
                        <li>社區服務推廣</li>
                    </ul>

                    <p>我們將繼續秉承愛國精神，為祖國的醫療衛生事業發展貢獻更多力量，為人民健康保駕護航。</p>
