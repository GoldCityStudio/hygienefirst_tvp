                    <h1 class="article-title news-detail-title">專業護理培訓認證計劃</h1>
                    <div class="article-image">
                        <img src="images/news/8.png" alt="專業護理培訓認證計劃" loading="lazy">
                    </div>
                    <p>Hygiene First 首衛很榮幸宣布推出專業護理培訓認證計劃！這項計劃旨在為護理人員提供系統性的專業培訓，提升護理服務品質和專業水平。</p>
                    
                    <p>培訓計劃內容：</p>
                    <ul>
                        <li>基礎護理技能培訓</li>
                        <li>專業醫療知識更新</li>
                        <li>緊急情況處理訓練</li>
                        <li>溝通技巧提升</li>
                        <li>職業道德教育</li>
                        <li>持續進修課程</li>
                    </ul>

                    <p>完成培訓的護理人員將獲得專業認證，並有機會參與進階培訓課程。我們相信，持續的專業發展是提供優質護理服務的關鍵。</p>
