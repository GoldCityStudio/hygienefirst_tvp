                  <div class="article-image">
                        <img src="images/news/18.png" alt="健康嘉年華活動" loading="lazy">
                    </div>
                    <p>Hygiene First 首衛成功舉辦健康嘉年華活動，為社區居民提供免費健康檢查和健康諮詢服務。</p>
                    
                    <p>活動內容包括：</p>
                    <ul>
                        <li>免費血壓測量</li>
                        <li>血糖檢測</li>
                        <li>健康諮詢服務</li>
                        <li>護理知識講座</li>
                        <li>健康生活指導</li>
                    </ul>

                    <p>我們感謝所有參與的居民和志願者，讓這次活動圓滿成功。未來我們將繼續舉辦更多類似的社區健康活動。</p>
