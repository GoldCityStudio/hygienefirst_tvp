                    <p>Hygiene First 首衛很榮幸成功舉辦了海上護理培訓工作坊！這次工作坊為我們的護理團隊提供了專業的海上醫療護理技能培訓。</p>
                    
                    <p>工作坊內容包括：</p>
                    <ul>
                        <li>海上環境下的緊急醫療處理</li>
                        <li>船舶醫療設備使用技巧</li>
                        <li>海上特殊情況的護理應對</li>
                        <li>海上急救技能實操訓練</li>
                        <li>海上護理安全規範</li>
                    </ul>

                    <p>透過這次培訓，我們的護理人員掌握了更全面的專業技能，能夠為客戶提供更優質的護理服務。感謝所有參與的護理人員的積極學習！</p>
