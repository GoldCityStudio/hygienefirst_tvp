                color: black;
            }

                right: 40px;
                margin: 0 5px 0 0;
                padding: 0 4px;
                font-family: sans-serif;
                font-size: 12px;
                background-color: rgba(255, 255, 255, 0.7);
                color: #333;
                text-align: left;
                text-overflow: ellipsis;
                white-space: nowrap;
                z-index: 1;
            }
            
            /* Custom popup styles */
            .ol-popup {
                position: absolute;
                background-color: white;
                box-shadow: 0 1px 4px rgba(0,0,0,0.2);
                padding: 15px;
                border-radius: 10px;
                border: 1px solid #cccccc;
                bottom: 12px;
                left: -50px;
                min-width: 200px;
                max-width: 300px;
            }
            .ol-popup:after, .ol-popup:before {
                top: 100%;
                border: solid transparent;
                content: " ";
                height: 0;
                width: 0;
                position: absolute;
                pointer-events: none;
            }
            .ol-popup:after {
                border-top-color: white;
                border-width: 10px;
                left: 48px;
                margin-left: -10px;
            }
            .ol-popup:before {
                border-top-color: #cccccc;
                border-width: 11px;
                left: 48px;
                margin-left: -11px;
            }
            .ol-popup-closer {
                text-decoration: none;
                position: absolute;
                top: 2px;
                right: 8px;
                font-size: 150%;
                color: #FF7A00;
                font-weight: bold;
            }
            .ol-popup-closer:after {
                content: "✕";
            }
            
            /* Collection point info styles */
            .collection-info h4 {
                margin: 0 0 8px 0;
                color: #FF7A00;
                font-size: 16px;
            }
            .collection-info p {
                margin: 4px 0;
                font-size: 14px;
                color: #666;
            }
            .collection-info .address {
                font-weight: bold;
                color: #333;
            }
            .collection-info .organization {
                font-style: italic;
                color: #888;
            }
            
            /* Control panel */
            .control-panel {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(255, 255, 255, 0.9);
                padding: 10px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                z-index: 1000;
            }
            .control-panel button {
                background: #FF7A00;
                color: white;
                border: none;
                padding: 8px 12px;
                margin: 2px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 12px;
            }
            .control-panel button:hover {
                background: #e66a00;
            }
        </style>

            // Process collection points data
            function loadCollectionPoints() {
                // Filter out region headers and empty entries
                const filteredPoints = collectionPointsData.filter(item => 
                    item.支持機構 && 
                    item.支持機構.trim() !== '' &&
                    item.回收過期藥物點 && 
                    item.回收過期藥物點.trim() !== '' &&
                    item.回收點地址 && 
                    item.回收點地址.trim() !== '' &&
                    item.latitude && 
                    item.longitude &&
                    !item.支持機構.includes('：') // Remove region headers
                );
                
                console.log(`Loaded ${filteredPoints.length} collection points`);
                return filteredPoints;
            }

            var basemapAPI = 'https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz/basemap/wgs84/{z}/{x}/{y}.png';
            var attributionInfo = '<a href="https://api.portal.hkmapservice.gov.hk/disclaimer" target="_blank" class="copyrightDiv">&copy; Map information from Lands Department</a><div style="width:28px;height:28px;display:inline-flex;background:url(https://api.hkmapservice.gov.hk/mapapi/landsdlogo.jpg);background-size:28px;"></div>';
            
            var map = new ol.Map({
                controls: ol.control.defaults.defaults({attribution: false}).extend([new ol.control.Attribution({collapsible: false})]),
                layers: [
                    new ol.layer.Tile({
                        source: new ol.source.XYZ({
                            url: basemapAPI,
                            attributions: attributionInfo
                        })
                    })
                ],
                target: 'map',
                logo: false,
                view: new ol.View({
                    center: ol.proj.fromLonLat([114.1694, 22.3193]), // Hong Kong center
                    zoom: 11,
                    minZoom: 10,
                    maxZoom: 20
                })
            });

            // Create vector layer for collection points
            var vectorSource = new ol.source.Vector();
            var vectorLayer = new ol.layer.Vector({
                source: vectorSource,
                style: new ol.style.Style({
                    image: new ol.style.Circle({
                        radius: 8,
                        fill: new ol.style.Fill({
                            color: '#FF7A00'
                        }),
                        stroke: new ol.style.Stroke({
                            color: '#ffffff',
                            width: 2
                        })
                    })
                })
            });

            map.addLayer(vectorLayer);

            // Add collection points to map
            function addCollectionPoints() {
                // Clear existing features
                vectorSource.clear();
                
                const points = loadCollectionPoints();
                
                points.forEach(function(point) {
                    var feature = new ol.Feature({
                        geometry: new ol.geom.Point(
                            ol.proj.fromLonLat([point.longitude, point.latitude])
                        ),
                        name: point.回收過期藥物點,
                        address: point.回收點地址,
                        organization: point.支持機構
                    });
                    vectorSource.addFeature(feature);
                });
                
                console.log(`Added ${points.length} collection points to map`);
            }

            // Popup functionality
            var container = document.getElementById('popup');
            var content = document.getElementById('popup-content');
            var closer = document.getElementById('popup-closer');

            var overlay = new ol.Overlay({
                element: container,
                autoPan: true,
                autoPanAnimation: {
                    duration: 250
                }
            });

            map.addOverlay(overlay);

            closer.onclick = function() {
                overlay.setPosition(undefined);
                closer.blur();
                return false;
            };

            map.on('singleclick', function(evt) {
                var feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
                    return feature;
                });

                if (feature) {
                    var coordinate = evt.coordinate;
                    var name = feature.get('name');
                    var address = feature.get('address');
                    var organization = feature.get('organization');

                    content.innerHTML = '<div class="collection-info">' +
                        '<h4>' + name + '</h4>' +
                        '<p class="address">' + address + '</p>' +
                        '<p class="organization">支持機構: ' + organization + '</p>' +
                        '</div>';
                    overlay.setPosition(coordinate);
                } else {
                    overlay.setPosition(undefined);
                }
            });

            // Control functions
            function showAllPoints() {
                addCollectionPoints();
                var extent = vectorSource.getExtent();
                map.getView().fit(extent, {padding: [50, 50, 50, 50]});
            }

            function centerOnHongKong() {
                map.getView().setCenter(ol.proj.fromLonLat([114.1694, 22.3193]));
                map.getView().setZoom(11);
            }

            function findNearestPoint() {
                const points = loadCollectionPoints();
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        var userLon = position.coords.longitude;
                        var userLat = position.coords.latitude;
                        
                        // Clear existing features and add all collection points
                        addCollectionPoints();
                        
                        // Center map on user location
                        map.getView().setCenter(ol.proj.fromLonLat([userLon, userLat]));
                        map.getView().setZoom(15);
                        
                        // Add user location marker
                        var userFeature = new ol.Feature({
                            geometry: new ol.geom.Point(
                                ol.proj.fromLonLat([userLon, userLat])
                            )
                        });
                        
                        var userStyle = new ol.style.Style({
                            image: new ol.style.Circle({
                                radius: 10,
                                fill: new ol.style.Fill({
                                    color: '#28a745'
                                }),
                                stroke: new ol.style.Stroke({
                                    color: '#ffffff',
                                    width: 3
                                })
                            })
                        });
                        
                        userFeature.setStyle(userStyle);
                        vectorSource.addFeature(userFeature);
                        
                        // Find nearest collection point
                        var nearestPoint = null;
                        var minDistance = Infinity;
                        
                        points.forEach(function(point) {
                            var distance = Math.sqrt(
                                Math.pow(point.longitude - userLon, 2) + 
                                Math.pow(point.latitude - userLat, 2)
                            );
                            if (distance < minDistance) {
                                minDistance = distance;
                                nearestPoint = point;
                            }
                        });
                        
                        if (nearestPoint) {
                            // Highlight nearest point
                            var nearestFeature = new ol.Feature({
                                geometry: new ol.geom.Point(
                                    ol.proj.fromLonLat([nearestPoint.longitude, nearestPoint.latitude])
                                )
                            });
                            
                            var nearestStyle = new ol.style.Style({
                                image: new ol.style.Circle({
                                    radius: 12,
                                    fill: new ol.style.Fill({
                                        color: '#dc3545'
                                    }),
                                    stroke: new ol.style.Stroke({
                                        color: '#ffffff',
                                        width: 3
                                    })
                                })
                            });
                            
                            nearestFeature.setStyle(nearestStyle);
                            vectorSource.addFeature(nearestFeature);
                            
                            // Show popup for nearest point
                            var coordinate = ol.proj.fromLonLat([nearestPoint.longitude, nearestPoint.latitude]);
                            content.innerHTML = '<div class="collection-info">' +
                                '<h4>最近的回收點</h4>' +
                                '<h4>' + nearestPoint.回收過期藥物點 + '</h4>' +
                                '<p class="address">' + nearestPoint.回收點地址 + '</p>' +
                                '<p class="organization">支持機構: ' + nearestPoint.支持機構 + '</p>' +
                                '</div>';
                            overlay.setPosition(coordinate);
                        }
                    });
                } else {
                    alert('Geolocation is not supported by this browser.');
                }
            }

            // Initialize map with collection points
            function initializeMap() {
                addCollectionPoints();
            }
            
            // Start the map
            initializeMap();
        </script>
