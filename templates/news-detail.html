<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}} - Hygiene First 首衛提供專業的醫療護理服務。">
    <meta name="keywords" content="{{title}},Hygiene First,首衛,醫療護理,健康服務">
    <meta name="author" content="Hygiene First">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="{{title}} - Hygiene First 首衛">
    <meta property="og:description" content="{{description}}">
    <meta property="og:image" content="https://www.hygienefirstgroup.com{{image}}">
    <meta property="og:url" content="{{og_url}}">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{title}} - Hygiene First 首衛">
    <meta name="twitter:description" content="{{description}}">
    <meta name="twitter:image" content="https://www.hygienefirstgroup.com{{image}}">
    <link rel="canonical" href="{{canonical_url}}" />
    <title>{{title}} - Hygiene First 首衛</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="enhanced-styles.css">   
    <link rel="stylesheet" href="dropdown-fix.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
     new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
     j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-W24RG7SG');</script>
    <!-- End Google Tag Manager -->
    
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="t8zzq2DovJMgoChag0ygoc_s76A2aTRXv4N78KJkw6I" />
    
    <!-- Structured Data for Article -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{title}}",
        "description": "{{description}}",
        "image": "https://www.hygienefirstgroup.com{{image}}",
        "author": {
            "@type": "Organization",
            "name": "Hygiene First 首衛有限公司"
        },
        "publisher": {
            "@type": "Organization",
            "name": "Hygiene First 首衛有限公司",
            "logo": {
                "@type": "ImageObject",
                "url": "https://www.hygienefirstgroup.com/images/HF%20logo/logo.png"
            }
        },
        "datePublished": "{{date}}",
        "dateModified": "{{date}}",
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{canonical_url}}"
        }
    }
    </script>
</head>
<body class="zh">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W24RG7SG"
     height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="overlay"></div>
    <div class="page-transition"></div>
    
    <main id="main-content" style="padding-top: 0px !important;">
        <!-- Article Content -->
        <article class="news-detail" style="padding-top: 0px !important;">
            <div class="container">
                <div class="article-content">
                    <h1 class="article-title news-detail-title">{{title}}</h1>
                    <div class="article-image">
                        <img src="{{image}}" alt="{{title}}" loading="lazy">
                    </div>
                    
                    <div class="article-body">
                        {{content}}
                        
                        <div class="call-to-action">
                            <h3>需要更多資訊？</h3>
                            <p>Hygiene First 首衛提供專業的醫療護理服務，隨時為您提供協助。</p>
                            <a href="contact.html" class="btn btn-primary">聯絡我們</a>
                        </div>
                    </div>
                    
                    <div class="article-meta">
                        <span class="article-date">發布日期：{{date}}</span>
                        <span class="article-category">分類：{{category}}</span>
                    </div>
                    
                    <div class="article-navigation">
                        <a href="news.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> 返回新聞列表
                        </a>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <!-- Include your existing header and footer scripts here -->
    <script src="script.js"></script>
</body>
</html>
