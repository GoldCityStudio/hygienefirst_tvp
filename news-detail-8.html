                    <h1 class="article-title news-detail-title">社區健康推廣計劃啟動</h1>
                    <div class="article-image">
                        <img src="images/news/7.png" alt="社區健康推廣計劃啟動" loading="lazy">
                    </div>
                    <p>Hygiene First 首衛很榮幸與多個社區組織合作，正式啟動大型社區健康推廣計劃！這項計劃旨在為市民提供免費的健康檢查和護理諮詢服務。</p>
                    
                    <p>計劃內容包括：</p>
                    <ul>
                        <li>免費血壓、血糖檢測</li>
                        <li>健康諮詢服務</li>
                        <li>護理知識講座</li>
                        <li>長者健康評估</li>
                        <li>家庭護理指導</li>
                        <li>緊急護理培訓</li>
                    </ul>

                    <p>我們將在各大社區中心、長者中心及公共場所設立服務站，為市民提供便捷的健康服務。歡迎大家踴躍參與，一起守護社區健康！</p>
